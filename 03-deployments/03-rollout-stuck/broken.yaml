apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: nginx:latest

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /does-not-exist
              port: 80

            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2

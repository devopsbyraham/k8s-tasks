apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkout-api

spec:
  replicas: 4

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: checkout

  template:
    metadata:
      labels:
        app: checkout

    spec:
      containers:
        - name: checkout
          image: nginx:1.26-does-not-exist
          ports:
            - containerPort: 80
